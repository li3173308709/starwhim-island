 showWishes(){const g=this.game,s=g.state,b=S.postoffice.ensure(g);const available=S.POSTCARDS.filter(p=>b.delivered>=p.at);const cards=b.active.map(e=>{const d=S.WISH_LETTERS.find(w=>w.id===e.id),now=S.postoffice.progress(g,e),finished=now>=d.need;return `<div class="wish-letter"><div class="wish-emoji">${d.icon}</div><div style="flex:1;min-width:0"><small class="wish-from">来自 ${E(d.who)} 的心愿</small><strong>${E(d.title)}</strong><p>${E(d.story)}</p><div class="progress-bar"><i style="width:${Math.min(100,100*now/d.need)}%"></i></div><small>${now}/${d.need} · ${finished?'可以盖章投递啦！':'想什么时候完成都可以'}</small></div><button class="small-button ${finished?'pink':''}" data-wish="${d.id}" ${finished?'':'disabled'}>${finished?'📮 送出':'💗 加油'}</button></div>`}).join('');const postcards=S.POSTCARDS.map(p=>`<div class="postcard ${b.delivered>=p.at?'':'locked'}"><span>${b.delivered>=p.at?p.icon:'💌'}</span><strong>${b.delivered>=p.at?E(p.title):'神秘明信片'}</strong><small>${b.delivered>=p.at?E(p.text):'寄出 '+p.at+' 封信后解锁'}</small></div>`).join('');this.panel('星愿邮局','随时帮助朋友，不设每日签到',`<p class="section-desc">这里的心愿没有倒计时。玩游戏、种花、探险时，就会自然完成小伙伴们的请求。每封送出的信都能获得一枚心愿邮票。💌</p><div class="card-note">📮 已寄出 <b>${b.delivered}</b> 封信 · 解锁明信片 <b>${available.length}/${S.POSTCARDS.length}</b> 张</div><h3 class="section-title">💌 等待寄出的温柔心愿</h3><div class="wish-stack">${cards}</div><h3 class="section-title">🌈 童话明信片收藏册</h3><div class="card-grid">${postcards}</div><div class="action-row"><button id="wishToGifts" class="small-button pink">🎁 去制作精灵礼物</button></div>`);document.querySelectorAll('[data-wish]').forEach(btn=>btn.onclick=()=>{if(S.postoffice.claim(g,btn.dataset.wish)){S.UI.toast('📮 寄出一封心愿信！得到一枚小邮票。');this.showWishes()}});by('wishToGifts').onclick=()=>this.showGifts(null)},
 showGifts(pet){const g=this.game,s=g.state;S.postoffice.ensure(g);const recipes=S.GIFT_RECIPES.map(d=>{const available=s.petals>=d.petals&&(s.seeds[d.seed]||0)>=1;return `<div class="tile-card"><span class="tile-icon">${d.emoji}</span><strong>${d.name}</strong><small>${d.story}</small><span class="tile-meta">${S.PLANTS[d.seed].emoji}种子×1 · 🌸花瓣×${d.petals} · 已制作${s.gifts[d.id]||0}</span><div class="action-row"><button class="small-button pink" data-makegift="${d.id}" ${available?'':'disabled'}>✨ 亲手制作</button>${pet&&s.gifts[d.id]>0?`<button class="small-button" data-give="${d.id}">💗 送给${S.PETS[pet].name}</button>`:''}</div></div>`}).join('');this.panel(pet?'送给'+S.PETS[pet].name+'的礼物':'魔法礼物工坊','用花瓣和种子送出温柔的心意',`<p class="section-desc">你种出的花可以变成礼物。送给精灵后，友情会成长，还能读到新的精灵回忆。所有礼物都可以靠游戏慢慢获得。</p><div class="card-note">🌸 花瓣 ${s.petals} · 你可以随时去花园收获种子</div><div class="card-grid">${recipes}</div><div class="action-row"><button id="giftToPets" class="small-button">🐾 回到精灵朋友</button></div>`);by('panelBody').querySelectorAll('[data-makegift]').forEach(btn=>btn.onclick=()=>{if(S.postoffice.craft(g,btn.dataset.makegift)){this.toast('🎁 新礼物制作成功！');this.showGifts(pet)}});by('panelBody').querySelectorAll('[data-give]').forEach(btn=>btn.onclick=()=>{if(S.postoffice.gift(g,pet,btn.dataset.give)){this.toast('💗 '+S.PETS[pet].name+'开心地收下礼物！');this.showGifts(pet)}});by('giftToPets').onclick=()=>this.showScreen('pets')},
 garden(i){this.gardenIndex=i;const g=this.game,s=g.state,plant=s.plants[i];this.currentScreen='garden';let html='';if(!plant){html=`<p class="section-desc">这块小花圃正在等待第一颗种子 🌱。选择一朵你喜欢的小花吧！</p><div class="card-grid">${Object.entries(S.PLANTS).map(([id,p])=>`<button class="tile-card" data-plant="${id}" ${(s.seeds[id]||0)===0?'disabled':''}><span class="tile-icon">${p.emoji}</span><strong>${p.name}</strong><small>种子还有 ${s.seeds[id]||0} 颗</small><span class="tile-meta">点击种下它</span></button>`).join('')}</div>`}else{const p=S.PLANTS[plant.type],grow=plant.watered||Date.now()-plant.plantedAt>=p.grow*1000;html=`<div style="text-align:center;padding:20px"><div style="font-size:79px">${grow?p.emoji:'🌱'}</div><h2 style="color:#ac7fa9">${p.name}</h2><p class="section-desc">${grow?'小花已经盛开了，快来收获吧！':'小花正在茁壮成长，轻轻浇点水就会开花啦！'}</p><button id="gardenAction" class="primary-button">${grow?'🌸 收获美丽的花朵':'💧 浇一勺魔法泉水'}</button></div>`}
 this.panel('我的小花圃','花语庭院 · 第'+(i+1)+'块花圃',html);by('panelBody').querySelectorAll('[data-plant]').forEach(b=>b.onclick=()=>{g.plant(i,b.dataset.plant);this.close()});const action=by('gardenAction');if(action)action.onclick=()=>{if(plant.watered||Date.now()-plant.plantedAt>=S.PLANTS[plant.type].grow*1000){g.harvest(i);this.close()}else{g.water(i);this.garden(i)}}}

</script><script>
(function(){const S=window.Starwhim;const by=id=>document.getElementById(id);const M={current:'',timeouts:[],data:{},
 later(cb,ms){const id=setTimeout(cb,ms);this.timeouts.push(id);return id},
 open(id){const def=S.MINIGAMES.find(x=>x.id===id);if(!def)return;S.UI.close();this.current=id;this.data={};by('miniBackdrop').classList.remove('hidden');by('miniTitle').textContent=def.emoji+' '+def.name;by('miniBody').innerHTML='';const impl=this[id+'Start'];if(impl)impl.call(this);S.audio.pop()},
 close(){this.timeouts.forEach(clearTimeout);this.timeouts=[];this.current='';this.data={};by('miniBackdrop').classList.add('hidden');by('miniBody').innerHTML='';S.audio.pop()},
 win(id,message,stars=18,petals=6){if(this.current!==id||this.data.rewarded)return;this.timeouts.forEach(clearTimeout);this.timeouts=[];this.data.rewarded=true;S.game.completeMini(id,stars,petals);by('miniBody').innerHTML=`<div class="win-box"><span class="win-emoji">🌈🎉✨</span><h3>太棒啦！</h3><p>${message}</p><p><b>获得 ⭐ ${stars}　🌸 ${petals}</b><br>还收到了一颗神奇的小种子！</p><div class="action-row" style="justify-content:center"><button class="primary-button" id="miniAgain">再玩一次 ✨</button><button class="small-button" id="miniBack">返回小岛</button></div></div>`;by('miniAgain').onclick=()=>this.open(id);by('miniBack').onclick=()=>this.close();S.audio.success()},
 memoryStart(){
  const icons=['🦄','🦋','🌷','🍓','🐰','🌟','🍄','🎀','🐱','🌈','🐣','🍬'];
  const chosen=[...icons].sort(()=>Math.random()-.5).slice(0,6);
  const deck=[...chosen,...chosen].map((icon,i)=>({id:i,icon,open:false,matched:false})).sort(()=>Math.random()-.5);
  this.data={deck,open:[],pairs:0,busy:false};
  const render=()=>{
   if(this.current!=='memory')return;
   by('miniBody').innerHTML=`<p class="mini-instruction">翻开两张卡片，找一找一样的小伙伴。可以慢慢想，没有时间限制哦 💗</p><span class="mini-progress">🌸 已找到 ${this.data.pairs} / 6 对</span><div class="mini-card-grid">${deck.map((c,i)=>`<button class="flip-card ${c.matched?'matched':c.open?'revealed':''}" aria-label="第${i+1}张卡片" data-card="${i}">${c.open||c.matched?c.icon:'✦'}</button>`).join('')}</div><div class="mini-help">小秘诀：记住刚才翻过的图案就好啦！</div>`;
   by('miniBody').querySelectorAll('[data-card]').forEach(button=>{
    button.onclick=()=>{
     const i=Number(button.dataset.card),card=deck[i];
     if(this.data.busy||card.matched||card.open)return;
     card.open=true;this.data.open.push(i);S.audio.pop();render();
     if(this.data.open.length!==2)return;
     const [a,b]=this.data.open;
     this.data.busy=true;
     if(deck[a].icon===deck[b].icon){
      this.later(()=>{
       deck[a].matched=true;deck[b].matched=true;
       this.data.pairs++;this.data.open=[];this.data.busy=false;
       S.audio.collect();
       if(this.data.pairs===6)this.win('memory','所有的小伙伴都找到自己的好朋友啦！',20,7);
       else render();
      },460);
     }else{
      this.later(()=>{deck[a].open=false;deck[b].open=false;this.data.open=[];this.data.busy=false;render();},820);
     }
    };
   });
  };
  render();
 },
 findStart(){const rng=S.rand(Math.floor(Math.random()*1e8)),items=[];for(let i=0;i<25;i++){let pos;for(let k=0;k<200;k++){const x=6+rng()*86,y=9+rng()*77;if(items.every(q=>Math.hypot(x-q.x,(y-q.y)*1.35)>11)){pos={x,y};break}}if(!pos)pos={x:rng()*80+10,y:rng()*75+10};items.push({...pos,id:i,icon:i<9?'⭐':['☁️','🍭','🌸','🦋','🍀','🪄','🍬','🐣'][i%8],found:false})}this.data={items,count:0};const render=()=>{if(this.current!=='find')return;by('miniBody').innerHTML=`<p class="mini-instruction">在梦幻天空里找出 <b>9颗小星星</b> ⭐，其他漂亮的小东西也来凑热闹啦！</p><span class="mini-progress">⭐ 找到 ${this.data.count} / 9 颗</span><div class="find-area" id="findArea">${items.filter(v=>!v.found).map(v=>`<button class="find-star" style="left:${v.x}%;top:${v.y}%;" data-find="${v.id}" aria-label="星空里的${v.icon}">${v.icon}</button>`).join('')}</div><div class="mini-help">不着急，每一颗星星都在等你哦 ✨</div>`;by('miniBody').querySelectorAll('[data-find]').forEach(b=>b.onclick=()=>{const item=items[Number(b.dataset.find)];if(item.icon!=='⭐'){S.audio.pop();b.style.transform='rotate(-12deg)';return}item.found=true;this.data.count++;S.audio.collect();if(this.data.count===9)this.win('find','星星全都找到回家的路了！',22,9);else render()})};render()},
 puzzleStart(){const themes=[['🦋','🌷','🌈','🍓','🏡','🍄','🐰','💎','🌟'],['🌞','🦊','🍒','🎈','🐣','🌼','🎵','💌','🧁'],['🐱','⭐','🍉','🦄','🍀','🎀','🐼','🌙','🪄'],['🪷','💎','🐝','🌸','🏠','🌈','🐠','🍰','☁️']];const target=S.pick(themes),deck=[...target];for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}if(deck.every((v,i)=>v===target[i]))[deck[0],deck[1]]=[deck[1],deck[0]];this.data={deck,target,selected:-1,steps:0};const render=()=>{by('miniBody').innerHTML=`<p class="mini-instruction">先记住魔法图案的顺序，再点两块图案互换位置。慢慢拼出下面这一幅画吧！</p><div class="puzzle-target">${target.join(' ')}</div><span class="mini-progress">🧩 已交换 ${this.data.steps} 次</span><div class="puzzle-grid">${deck.map((icon,i)=>`<button class="puzzle-tile ${this.data.selected===i?'selected':''}" data-puzzle="${i}">${icon}</button>`).join('')}</div><p class="mini-help">先点一个图案，再点另一个图案，它们就会交换位置。</p>`;by('miniBody').querySelectorAll('[data-puzzle]').forEach(b=>b.onclick=()=>{const i=+b.dataset.puzzle;S.audio.pop();if(this.data.selected===-1){this.data.selected=i;render();return}const prev=this.data.selected;this.data.selected=-1;if(prev!==i){[deck[prev],deck[i]]=[deck[i],deck[prev]];this.data.steps++;}if(deck.every((v,j)=>v===target[j]))this.win('puzzle','你把散落的童话图案都拼回去了！',24,8);else render()})};render()},
 bakeryStart(){const bases=[['草莓蛋糕','🍰'],['云朵杯糕','🧁'],['魔法布丁','🍮']],fruits=[['草莓','🍓'],['樱桃','🍒'],['蜜桃','🍑'],['柠檬','🍋']],tops=[['糖霜星星','✨'],['巧克力','🍫'],['花朵','🌸'],['彩虹','🌈']];this.data={base:0,fruit:0,top:0};const group=(arr,key)=>`<div class="choice-row">${arr.map(([name,emoji],i)=>`<button class="choice-button ${this.data[key]===i?'selected':''}" data-choice="${key}:${i}">${emoji} ${name}</button>`).join('')}</div>`;const render=()=>{by('miniBody').innerHTML=`<p class="mini-instruction">亲手制作独一无二的魔法甜点吧！换一换食材，每次都能做出不一样的惊喜。</p><div class="bakery-stage"><div class="cake-emoji">${bases[this.data.base][1]}</div><div style="font-size:37px">${fruits[this.data.fruit][1]} ${tops[this.data.top][1]}</div><div class="cake-tags">${fruits[this.data.fruit][0]} · ${tops[this.data.top][0]}</div></div><h3 class="section-title">① 选择甜品</h3>${group(bases,'base')}<h3 class="section-title">② 添加美味水果</h3>${group(fruits,'fruit')}<h3 class="section-title">③ 装点魔法</h3>${group(tops,'top')}<div class="action-row" style="justify-content:center"><button id="bakeDone" class="primary-button">🍰 完成我的魔法甜点</button></div>`;by('miniBody').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const [key,n]=b.dataset.choice.split(':');this.data[key]=+n;S.audio.pop();render()});by('bakeDone').onclick=()=>{const key=[this.data.base,this.data.fruit,this.data.top].join('-');const s=S.game.state;s.recipeBook=s.recipeBook||[];const isNew=!s.recipeBook.includes(key);if(isNew){s.recipeBook.push(key);S.game.save();S.UI.toast('📖 新口味已收录：甜点配方 '+s.recipeBook.length+'/48')}this.win('bakery','香喷喷的'+fruits[this.data.fruit][0]+bases[this.data.base][0]+'诞生啦！'+(isNew?'这是一份新发现的魔法配方。':'这是你珍藏过的经典口味！'),19,7)}};render()},
 musicStart(){
  const emojis=['🌸','🍃','🌞','🌙'];
  this.data={level:1,sequence:[],index:0,playing:false};
  const render=()=>{
   const d=this.data;
   by('miniBody').innerHTML=`<p class="mini-instruction">先听月芽弹一次彩色音符，再照着顺序点一遍。弹错也不要紧，可以再听一次！</p><span class="mini-progress">🎵 第 ${d.level} / 3 小节 · 已完成 ${d.index}/${d.sequence.length} 个音符</span><div class="music-pads">${emojis.map((e,i)=>`<button class="music-pad" data-note="${i}" aria-label="第${i+1}个音符">${e}</button>`).join('')}</div><div class="action-row" style="justify-content:center"><button id="musicPlay" class="primary-button">▶ ${d.sequence.length?'再听一次':'听一段魔法旋律'}</button></div><p id="musicStatus" class="mini-help">准备好了吗？先来听听音符！</p>`;
   by('musicPlay').onclick=()=>this.playMusic();
   by('miniBody').querySelectorAll('[data-note]').forEach(button=>{
    button.onclick=()=>{
     const note=Number(button.dataset.note);
     S.audio.note(note);
     if(d.playing||!d.sequence.length)return;
     if(note===d.sequence[d.index]){
      d.index++;
      button.classList.add('lit');
      this.later(()=>button.classList.remove('lit'),220);
      if(d.index===d.sequence.length){
       d.playing=true;S.audio.collect();
       this.later(()=>{
        if(d.level>=3)this.win('music','月芽说：你演奏出了世界上最温柔的星光旋律！',25,9);
        else{d.level++;d.sequence=[];d.index=0;d.playing=false;render();by('musicStatus').textContent='太棒啦，开始新的一小节吧！'}
       },520);
      }else{
       by('musicStatus').textContent='好听！继续点下一个音符 ✨';
      }
     }else{
      d.index=0;S.audio.fail();
      by('musicStatus').textContent='没关系，再听一遍，就会想起来啦 💗';
     }
    };
   });
  };
  this.data.render=render;
  render();
 },

    box.querySelector('input').checked=S.game.state.settings.music!==false;
    body.querySelector('.settings-grid').append(box);
    box.querySelector('input').addEventListener('change',e=>{S.game.state.settings.music=e.target.checked;S.game.save();if(e.target.checked)resumeAudio();S.UI.toast('背景音乐设置已保存')});
  }
 }
 return result};
})();
