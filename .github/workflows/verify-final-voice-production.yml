name: Final production acceptance for voice-adjusted game
on:
  push:
    paths:
      - '.github/workflows/verify-final-voice-production.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STARWHIM_URL: https://starwhim-island.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Chrome test runner
        run: |
          python -m pip install playwright==1.56.0
          google-chrome --version
      - name: Verify 914 MP3, Chinese lessons and English first-five-cards
        run: python scripts/verify_learning_v23_online.py
      - name: Verify English en-US and girl voice 0.8x on actual production website
        run: python scripts/verify_voice_v24_online.py
