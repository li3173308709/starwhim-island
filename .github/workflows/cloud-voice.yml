name: Starwhim voice synthesis (no local setup)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cloud-voice.yml'
permissions:
  contents: write
concurrency:
  group: starwhim-voice-synthesis
  cancel-in-progress: false
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU voice synthesis dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'f5-tts==1.1.5' 'transformers<5'
      - name: Clone voice from user's reference MP3 on cloud CPU
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DOWNLOAD_TIMEOUT: '120'
          OMP_NUM_THREADS: '4'
          SHARD: ${{ matrix.shard }}
        run: python scripts/clone_on_github.py --shard "$SHARD" --shards 4
      - uses: actions/upload-artifact@v4
        with:
          name: voice-clips-${{ matrix.shard }}
          path: generated/*.mp3
          retention-days: 3
          if-no-files-found: error
  pack:
    needs: synthesize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: voice-clips-*
          path: generated
          merge-multiple: true
      - name: Embed all 79 MP3 clips in offline HTML
        run: python scripts/pack_voice.py
      - name: Commit finished game back to GitHub
        run: |
          git config user.name "starwhim-voice-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: embed 79 AI-cloned Mandarin voice clips" || exit 0
          git push