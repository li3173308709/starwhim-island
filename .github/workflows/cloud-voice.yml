name: Starwhim voice synthesis (cloud only)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cloud-voice.yml'

permissions:
  contents: write

concurrency:
  group: starwhim-voice-synthesis
  cancel-in-progress: false

env:
  HF_HUB_DISABLE_TELEMETRY: '1'
  HF_HUB_DOWNLOAD_TIMEOUT: '180'
  OMP_NUM_THREADS: '4'
  PYTHONUNBUFFERED: '1'

jobs:
  smoke:
    name: Validate dependencies and synthesize one voice line
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg and pinned CPU inference stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          printf 'numpy==1.26.4\npyarrow==25.0.1\ndatasets==5.0.1\ntorch==2.5.1+cpu\ntorchaudio==2.5.1+cpu\n' > /tmp/starwhim-constraints.txt
          python -m pip install -c /tmp/starwhim-constraints.txt 'f5-tts==1.1.5' 'transformers<5'
          python -m pip check
      - name: Confirm NumPy PyArrow and F5 imports
        run: |
          python - <<'PY'
          import numpy, pyarrow, datasets, torch, torchaudio
          print('numpy', numpy.__version__, 'pyarrow', pyarrow.__version__, 'datasets', datasets.__version__)
          print('torch', torch.__version__, 'torchaudio', torchaudio.__version__)
          from f5_tts.api import F5TTS
          print('F5TTS import successful')
          PY
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/torch/hub
          key: starwhim-f5tts-model-v1-20261118
      - name: Produce one actual MP3 before full batch
        run: python scripts/clone_on_github.py --shard 0 --shards 4 --limit 1
      - name: Verify MP3 format and duration
        run: |
          test -n "$(find generated -maxdepth 1 -name '*.mp3' -type f -size +1k -print -quit)"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 generated/*.mp3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-sample
          path: generated/*.mp3
          if-no-files-found: ignore
          retention-days: 7

  synthesize:
    needs: smoke
    name: Synthesize shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU inference stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          printf 'numpy==1.26.4\npyarrow==25.0.1\ndatasets==5.0.1\ntorch==2.5.1+cpu\ntorchaudio==2.5.1+cpu\n' > /tmp/starwhim-constraints.txt
          python -m pip install -c /tmp/starwhim-constraints.txt 'f5-tts==1.1.5' 'transformers<5'
          python -m pip check
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/torch/hub
          key: starwhim-f5tts-model-v1-20261118
      - name: Synthesize game dialogue from supplied voice reference
        env:
          SHARD: ${{ matrix.shard }}
        run: python scripts/clone_on_github.py --shard "$SHARD" --shards 4
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: voice-clips-${{ matrix.shard }}
          path: generated/*.mp3
          retention-days: 7
          if-no-files-found: error

  pack:
    needs: synthesize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: voice-clips-*
          path: generated
          merge-multiple: true
      - name: Validate and embed all 79 generated MP3 clips in game HTML
        run: python scripts/pack_voice.py
      - name: Commit completed game
        run: |
          git config user.name "starwhim-voice-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes to commit"; else
            git commit -m "feat: embed 79 AI-cloned Mandarin voice clips"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
