name: Verify advanced game production release
on:
  push:
    paths:
      - '.github/workflows/verify-advanced-online.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser automation
        run: |
          python -m pip install playwright==1.56.0
          google-chrome --version
      - name: Check all original and advanced game recordings
        run: |
          python scripts/audit_full_voice.py
          python scripts/verify_advanced_online.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starwhim-advanced-online-screenshots
          path: advanced-live-*.png
          retention-days: 14
          if-no-files-found: ignore
