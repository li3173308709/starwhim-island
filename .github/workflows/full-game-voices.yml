name: Generate contextual game girl voice clips
on:
  push:
    paths:
      - '.github/workflows/full-game-voices.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: contextual-voice-generation
  cancel-in-progress: false
env:
  HF_HUB_DISABLE_TELEMETRY: '1'
  HF_HUB_DOWNLOAD_TIMEOUT: '180'
  OMP_NUM_THREADS: '4'
  PYTHONUNBUFFERED: '1'
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/expand_voice_plan.py
      - uses: actions/upload-artifact@v4
        with:
          name: contextual-manifest
          path: voice-extra-plan.json
          if-no-files-found: error
  synthesis:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: contextual-manifest
      - name: Prepare F5 model and audio toolkit
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          printf 'numpy==1.26.4\npyarrow==25.0.1\ndatasets==5.0.1\ntorch==2.5.1+cpu\ntorchaudio==2.5.1+cpu\n' > /tmp/starwhim-constraints.txt
          python -m pip install -c /tmp/starwhim-constraints.txt 'f5-tts==1.1.5' 'transformers<5'
          python -m pip check
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/torch/hub
          key: starwhim-f5tts-model-v1-20261118
      - name: Generate missing game sentence recordings
        env:
          SHARD: ${{ matrix.shard }}
        run: python scripts/clone_on_github.py --extra-plan --shard "$SHARD" --shards 8
      - name: Confirm audio resources exist
        run: |
          test -n "$(find generated -maxdepth 1 -name '*.mp3' ! -name 'original.mp3' -type f -size +1k -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: contextual-clips-${{ matrix.shard }}
          path: generated/*.mp3
          retention-days: 7
          if-no-files-found: error
  package:
    needs: synthesis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: contextual-manifest
      - uses: actions/download-artifact@v4
        with:
          pattern: contextual-clips-*
          path: generated
          merge-multiple: true
      - run: python scripts/pack_additional_voice.py
      - name: Commit new embedded audio to game
        run: |
          git config user.name "starwhim-voice-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html voice-extra-plan.json
          git commit -m "feat: embed contextual girl voice for area and quest combinations"
          git pull --rebase origin main
          git push origin HEAD:main
