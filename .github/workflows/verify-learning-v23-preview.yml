name: Acceptance test 914-voice learning game preview
on:
  push:
    paths:
      - '.github/workflows/verify-learning-v23-preview.yml'
      - 'scripts/verify_learning_v23_online.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STARWHIM_URL: https://starwhim-island-4moa1u14i-li3173308709-4921.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome test framework
        run: |
          python -m pip install playwright==1.56.0
          google-chrome --version
      - name: Verify all 914 MP3, real audio and teaching game in Chrome, phone modes
        run: python scripts/verify_learning_v23_online.py
