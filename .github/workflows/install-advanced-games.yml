name: Install and test advanced mini games
on:
  push:
    paths:
      - '.github/workflows/install-advanced-games.yml'
      - 'scripts/advanced_games.js'
      - 'scripts/install_advanced_games.py'
      - 'scripts/test_advanced_games.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: advanced-games-install
  cancel-in-progress: false
jobs:
  package-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install 3 level-based games into 194-voice HTML
        run: |
          python scripts/install_advanced_games.py
          python scripts/audit_full_voice.py
      - name: Install Chrome test runner
        run: |
          python -m pip install playwright==1.56.0
          google-chrome --version
      - name: Play each advanced challenge on three screen sizes
        run: python scripts/test_advanced_games.py
      - name: Commit complete new HTML version
        run: |
          git config user.name "starwhim-game-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "feat: add playable maze sudoku and codebreaker challenges"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
