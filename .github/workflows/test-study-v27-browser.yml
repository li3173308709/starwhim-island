name: Verify 200 Hanzi and 200 English meanings voice corrections
on:
  workflow_run:
    workflows:
      - Correct 200 Hanzi and 200 Chinese meanings in original girl voice
    types:
      - completed
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome test runner
        run: |
          python -m pip install playwright==1.56.0
          google-chrome --version
      - name: Verify actual Mandarin voice binding and Chinese meaning across screen sizes
        run: python -u scripts/verify_study_corrections_v27.py
