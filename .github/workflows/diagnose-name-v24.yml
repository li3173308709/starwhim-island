name: Diagnose extra syllable before Ding Yiyi
on:
  push:
    paths:
      - '.github/workflows/diagnose-name-v24.yml'
      - 'scripts/inspect_name_timestamps.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timestamps:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Mandarin word-aligned speech recognizer
        run: python -m pip install 'faster-whisper==1.2.1' numpy
      - name: Locate leading spoken syllable timestamps
        run: python -u scripts/inspect_name_timestamps.py
