name: Export completed standalone game
on:
  push:
    paths:
      - '.github/workflows/export-game.yml'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate 205 girls voice MP3 and 19 game modules
        run: |
          python scripts/audit_full_voice.py
          python - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('index.html').read_text()
          m=re.search(r'window\.StarwhimVoicePack\s*=\s*({.*?});\s*</script>',s,re.S)
          assert m and len(json.loads(m.group(1))['audio'])>=205
          assert 'StarwhimAdvancedGames' in s and 'window.StarwhimExpansion19=' in s
          print('PASS complete advanced single-file game')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: starwhim-island-205-voice-19-game-complete
          path: index.html
          if-no-files-found: error
          retention-days: 30
