name: Export completed standalone game
on:
  push:
    paths:
      - '.github/workflows/export-game.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate all 194 recordings
        run: python scripts/audit_full_voice.py
      - uses: actions/upload-artifact@v4
        with:
          name: starwhim-island-complete-game
          path: index.html
          if-no-files-found: error
          retention-days: 30
