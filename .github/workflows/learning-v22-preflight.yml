name: Verify 200 word teaching preflight
on:
  push:
    paths:
      - '.github/workflows/learning-v22-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --check scripts/learning_v22.js
      - run: python scripts/prepare_learning_voices.py
