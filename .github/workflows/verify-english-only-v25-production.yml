name: Final production English-voice match and unchanged Hanzi acceptance
on:
  push:
    paths:
      - '.github/workflows/verify-english-only-v25-production.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STARWHIM_URL: https://starwhim-island.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        run: |
          python -m pip install playwright==1.56.0
          google-chrome --version
      - name: Verify production website English-only audio, 200 meanings and Hanzi unchanged
        run: python -u scripts/verify_english_only_v25_online.py
