name: Verify completed 14-game release
on:
  workflow_run:
    workflows: ["Generate three replayable arcade girl voices"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 14 games and actual recorded narration
        run: |
          python scripts/audit_full_voice.py
          python - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('index.html').read_text()
          m=re.search(r'window\.StarwhimVoicePack\s*=\s*({.*?});\s*</script>',s,re.S)
          assert m
          audio=json.loads(m.group(1))['audio']
          lines=json.loads(Path('voice-arcade-plan.json').read_text())['lines']
          assert len(audio)>=200
          assert len(lines)==3
          assert all(line['text'] in audio for line in lines)
          assert 'window.StarwhimArcade' in s
          for name in ['彩虹飞行大冒险','星星合成研究所','精灵花园守卫战']:
              assert name in s
          print('PASS: 14 games, 200 bundled MP3 clips, all three new narration lines')
          PY
      - name: Check playable games on desktop and phone Chrome
        run: |
          python -m pip install playwright==1.56.0
          python scripts/test_arcade_browser.py
      - name: Save the verified complete offline game
        uses: actions/upload-artifact@v4
        with:
          name: starwhim-island-14-games-200-voices
          path: index.html
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcade-final-browser-views
          path: arcade-*.png
          retention-days: 10
          if-no-files-found: ignore
