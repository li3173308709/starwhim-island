name: Test corrected Chinese and English voices in browser
on:
  push:
    paths:
      - '.github/workflows/verify-voice-v24-preview.yml'
      - 'scripts/verify_voice_v24_online.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      STARWHIM_URL: https://starwhim-island-droo3t6z8-li3173308709-4921.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare Chrome browser testing
        run: |
          python -m pip install playwright==1.56.0
          google-chrome --version
      - name: Verify English en-US, Chinese 0.8x, fade-in and 914 voices
        run: python -u scripts/verify_voice_v24_online.py
