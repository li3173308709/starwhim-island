name: Verify three new arcade games
on:
  push:
    paths:
      - '.github/workflows/test-arcade.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build new minigames locally
        run: python scripts/install_arcade_games.py
      - name: Validate embedded voice and JS
        run: python scripts/audit_full_voice.py
      - name: Install Chrome automation
        run: |
          python -m pip install playwright==1.56.0
          google-chrome --version
      - name: Exercise each game in desktop and mobile Chrome
        run: python scripts/test_arcade_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-arcade-screenshots
          path: arcade-*.png
          if-no-files-found: ignore
