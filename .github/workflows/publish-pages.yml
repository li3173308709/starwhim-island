name: Publish completed game via GitHub Pages
on:
  push:
    paths:
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish-game-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit full MP3 narration
        run: python scripts/audit_full_voice.py
      - name: Prepare standalone game package
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          echo > _site/.nojekyll
          python - <<'PY'
          from pathlib import Path
          import hashlib
          for p in [Path('index.html'), Path('_site/index.html')]:
              print(p,hashlib.sha256(p.read_bytes()).hexdigest(),p.stat().st_size)
          assert Path('index.html').read_bytes()==Path('_site/index.html').read_bytes()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
