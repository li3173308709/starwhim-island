name: Recover v27 synthesized recordings and finish package
on:
  push:
    paths:
      - '.github/workflows/recover-study-v27.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  recover-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download actual 403 F5-TTS recordings from successful 20-shard synthesis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p generated
          gh run download 45096827163 --repo li3173308709/starwhim-island --name v27-corrected-study-manifest --dir .
          gh run download 45096827163 --repo li3173308709/starwhim-island --pattern 'v27-corrected-girl-mp3-*' --dir /tmp/v27-recordings
          python - <<'PY'
          from pathlib import Path
          import json, hashlib
          lines=json.loads(Path('voice-study-corrections-v27-plan.json').read_text(encoding='utf-8'))['lines']
          expected=[str(row['id'])+'.mp3' for row in lines]
          assert len(expected)==403 and len(set(expected))==403, 'manifest has duplicate or unexpected IDs'
          sources={}
          for file in Path('/tmp/v27-recordings').rglob('*.mp3'):
              sources.setdefault(file.name,[]).append(file)
          missing=sorted(set(expected)-set(sources))
          assert not missing, f'missing real synthesized recordings: {missing[:20]}'
          for name in expected:
              variants=sources[name]
              hashes={hashlib.sha256(f.read_bytes()).hexdigest() for f in variants}
              assert len(hashes)==1, f'conflicting MP3 artifacts for {name}'
              (Path('generated')/name).write_bytes(variants[0].read_bytes())
          extra=sorted(set(sources)-set(expected))
          print(f'PASS: {len(expected)} manifest-matched real F5-TTS MP3 files; ignored {len(extra)} unrelated artifact file(s): {extra[:10]}')
          PY
      - name: Integrate actual newly synthesized MP3s and validate
        run: |
          python scripts/install_study_corrections_v27.py
          python scripts/audit_full_voice.py
          python - <<'PY'
          from pathlib import Path
          import json,re,base64,hashlib
          s=Path('index.html').read_text(encoding='utf-8')
          a=json.loads(re.search(r'window\.StarwhimVoicePack\s*=\s*({.*?});\s*</script>',s,re.S).group(1))['audio']
          manifest=json.loads(Path('voice-study-corrections-v27-plan.json').read_text())['lines']
          assert len(a)==914 and len(manifest)==403
          assert s.count('data:audio/mpeg;base64,')==1114
          for row in manifest:
            src=(Path('generated')/(row['id']+'.mp3')).read_bytes()
            assert base64.b64decode(a[row['key']].split(',',1)[1])==src,row['key']
          assert '已补上全部汉字的可点击朗读功能' not in s
          assert '正式配音将朗读汉字和例词' not in s
          assert '"char":"米","py":"mǐ","word":"大米"' in s and '"char":"饭","py":"fàn","word":"米饭"' in s and '中文是：猫。' in s
          assert "window.StarwhimEnglishPronunciationPack=" in s
          print('PASS 403 actual synthesized files byte-identical to HTML MP3, 914 Chinese/girl + 200 English')
          print('HTML_SHA256',hashlib.sha256(s.encode()).hexdigest())
          PY
      - name: Commit final corrected HTML
        run: |
          git config user.name starwhim-voice-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/learning_v22.js scripts/learning_ui_voices_v23.js voice-study-corrections-v27-plan.json study-v27-audit.json
          git commit -m "fix: install 403 real F5-TTS v27 recordings and exact Hanzi voice notes"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Export full offline HTML
        run: cp index.html starwhim-island-hanzi-voice-v27.html
      - uses: actions/upload-artifact@v4
        with:
          name: starwhim-island-hanzi-voice-v27
          path: starwhim-island-hanzi-voice-v27.html
          retention-days: 30
          if-no-files-found: error
