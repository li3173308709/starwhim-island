name: Verify live v26 mobile English and moon workshop preview
on:
  push:
    paths:
      - '.github/workflows/verify-mobile-v26-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STARWHIM_URL: https://starwhim-island-bkb1nvcgo-li3173308709-4921.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome testing framework
        run: |
          python -m pip install playwright==1.56.0
          google-chrome --version
      - name: Test actual Vercel preview and phone English recorded speech
        run: python -u scripts/verify_mobile_english_moon_v26.py
