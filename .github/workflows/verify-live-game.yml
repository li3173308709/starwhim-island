name: Validate final live game release
on:
  push:
    paths:
      - '.github/workflows/verify-live-game.yml'
      - 'scripts/verify_production_browser.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser and Chinese fonts
        run: |
          python -m pip install playwright==1.56.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          google-chrome --version
      - name: Audit original 194-MP3 package
        run: python scripts/audit_full_voice.py
      - name: Test true Vercel production website
        run: python scripts/verify_production_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-voice-production-screenshots
          path: live-game-*.png
          retention-days: 14
          if-no-files-found: ignore
