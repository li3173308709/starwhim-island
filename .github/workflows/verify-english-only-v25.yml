name: Verify English-only language voice and 200 exact meanings
on:
  push:
    paths:
      - '.github/workflows/verify-english-only-v25.yml'
      - 'scripts/verify_english_only_v25_online.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STARWHIM_URL: https://starwhim-island-ba4x0k31x-li3173308709-4921.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Chrome test dependencies
        run: |
          python -m pip install playwright==1.56.0
          google-chrome --version
      - name: Check English Chinese audio matching, selective speed, and Hanzi unchanged
        run: python -u scripts/verify_english_only_v25_online.py
