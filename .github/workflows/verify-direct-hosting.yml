name: Validate direct-hosted full game chunks
on:
  push:
    paths:
      - '.github/workflows/verify-direct-hosting.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STARWHIM_URL: https://starwhim-island-of03rzfvv-li3173308709-4921.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          google-chrome --version
      - name: Full English and Hanzi lesson acceptance
        run: python scripts/verify_learning_v23_online.py
      - name: English audio and Chinese voice speed acceptance
        run: python scripts/verify_voice_v24_online.py
