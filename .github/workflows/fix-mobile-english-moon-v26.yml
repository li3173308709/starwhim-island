name: Fix mobile English voice and moon puzzle narration
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-english-moon-v26.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: starwhim-mobile-english-v26
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare tools for natural English sound
        run: |
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          python -m pip install "edge-tts>=7,<8"
          node --version
      - name: Fix English mobile speaker and prevent moon puzzle from triggering Hanzi narration
        run: python -u scripts/fix_mobile_english_moon_v26.py
      - name: Record all 200 English words in a natural independent English voice
        run: python -u scripts/generate_english_mp3_v26.py
      - name: Embed English recordings without changing 914 girl recordings
        run: python -u scripts/embed_english_mp3_v26.py
      - name: Static validation before release
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('index.html').read_text()
          a=json.loads(re.search(r'window\.StarwhimVoicePack\s*=\s*({.*?});\s*</script>',s,re.S).group(1))['audio']
          b=json.loads(re.search(r'window\.StarwhimEnglishPronunciationPack\s*=\s*({.*?});\s*</script>',s,re.S).group(1))['audio']
          assert len(a)==914 and len(b)==200
          assert b['cat'].startswith('data:audio/mpeg;base64,')
          assert "function educationalGameActive()" in s
          assert "current.playbackRate=root.querySelector('.learnfirst')?0.72:0.8" in s
          assert "lastHanziVoice.playbackRate=0.8" in s
          assert "M.moontracksStart=function()" in s
          assert "window.StarwhimEnglishLearnFirst=" in s
          assert s.count('</html>')==1
          print("PASS: 914 original MP3, 200 en-US MP3, Chinese lessons isolated, single HTML")
          PY
      - name: Commit repaired game and independent English sound pack
        run: |
          git config user.name starwhim-voice-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/learning_v22.js scripts/learning_ui_voices_v23.js english-pronunciations-v26.js english-mobile-v26-audit.json
          git commit -m "fix: reliable 200-word English playback on phones and isolate moon puzzle narrator"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Export complete offline game
        run: |
          cp index.html starwhim-island-mobile-english-moon-v26.html
      - uses: actions/upload-artifact@v4
        with:
          name: starwhim-island-mobile-english-moon-v26-html
          path: starwhim-island-mobile-english-moon-v26.html
          if-no-files-found: error
          retention-days: 30
