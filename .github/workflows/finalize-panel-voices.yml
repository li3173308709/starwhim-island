name: Finalize narrated game panels
on:
  workflow_run:
    workflows:
      - Generate contextual game girl voice clips
    types:
      - completed
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: narrated-panel-voice-finalization
  cancel-in-progress: false
env:
  HF_HUB_DISABLE_TELEMETRY: '1'
  HF_HUB_DOWNLOAD_TIMEOUT: '180'
  OMP_NUM_THREADS: '4'
  PYTHONUNBUFFERED: '1'
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/prepare_panel_voice.py
      - uses: actions/upload-artifact@v4
        with:
          name: panel-manifest
          path: voice-panel-plan.json
          if-no-files-found: error
  synthesize:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: panel-manifest
      - name: Install model and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          printf 'numpy==1.26.4\npyarrow==25.0.1\ndatasets==5.0.1\ntorch==2.5.1+cpu\ntorchaudio==2.5.1+cpu\n' > /tmp/starwhim-constraints.txt
          python -m pip install -c /tmp/starwhim-constraints.txt 'f5-tts==1.1.5' 'transformers<5'
          python -m pip check
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/torch/hub
          key: starwhim-f5tts-model-v1-20261118
      - name: Synthesize panel narration clips
        env:
          SHARD: ${{ matrix.shard }}
        run: python scripts/clone_on_github.py --manifest voice-panel-plan.json --shard "$SHARD" --shards 4
      - uses: actions/upload-artifact@v4
        with:
          name: narrated-panel-clips-${{ matrix.shard }}
          path: generated/*.mp3
          retention-days: 7
          if-no-files-found: error
  package:
    needs: synthesize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: panel-manifest
      - uses: actions/download-artifact@v4
        with:
          pattern: narrated-panel-clips-*
          path: generated
          merge-multiple: true
      - name: Package recorded voice and patch every panel
        run: |
          python scripts/pack_additional_voice.py --manifest voice-panel-plan.json
          python scripts/complete_voice_routes.py
      - name: Verify narration coverage and static HTML
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          s=Path('index.html').read_text()
          p=json.loads(Path('scripts/panel_voice_content.json').read_text())
          match=re.search(r'window\.StarwhimVoicePack\s*=\s*({.*?});\s*</script>',s,re.S)
          assert match
          a=json.loads(match.group(1))['audio']
          assert len(a)>=190 and all(x in a for x in p.values())
          assert 'const PANEL_VOICE_SCRIPTS=' in s
          assert s.count('</html>')==1
          print('Voice sample inventory:',len(a),'narrated panels:',len(p))
          PY
      - name: Audit every installed MP3 and game playback route
        run: python scripts/audit_full_voice.py
      - name: Commit final narrated game
        run: |
          git config user.name "starwhim-voice-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html voice-panel-plan.json
          git commit -m "feat: complete narrated panels with girl's voice"
          git pull --rebase origin main
          git push origin HEAD:main
