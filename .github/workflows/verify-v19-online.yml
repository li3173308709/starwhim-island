name: Verify deployed 19-game learning adventure
on:
  push:
    paths:
      - '.github/workflows/verify-v19-online.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.56.0
          google-chrome --version
      - name: Validate exact live 19-game feature set and actual 205 MP3 playback
        run: python scripts/verify_v19_production.py
