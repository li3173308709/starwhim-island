name: Build and test v1.9 new game expansion
on:
  push:
    paths:
      - '.github/workflows/build-expansion-v19.yml'
      - 'scripts/expansion_v19.js'
      - 'scripts/install_expansion_v19.py'
      - 'scripts/test_expansion_v19.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify extension syntax
        run: node --check scripts/expansion_v19.js
      - name: Install five new games
        run: python scripts/install_expansion_v19.py
      - name: Verify bundled MP3 remained intact
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          s=Path('index.html').read_text()
          p=json.loads(re.search(r'window\.StarwhimVoicePack\s*=\s*({.*?});\s*</script>',s,re.S).group(1))
          assert len(p['audio'])>=200
          assert 'window.StarwhimExpansion19=' in s
          print('Retained',len(p['audio']),'female voice clips')
          PY
      - name: Install browser testing engine
        run: |
          python -m pip install playwright==1.56.0
          google-chrome --version
      - name: Exercise all five games in three screen sizes
        run: python scripts/test_expansion_v19.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starwhim-v19-browser-checks
          path: newgames-*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit the expanded single-file game
        run: |
          git config user.name 'starwhim-game-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'feat: integrate 19 games including Chinese 200 and English 80'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
