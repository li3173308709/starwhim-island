name: Generate v1.9 five new girl voices
on:
  push:
    paths:
      - '.github/workflows/v19-voices.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: starwhim-v19-voices
  cancel-in-progress: false
jobs:
  synthesize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reference voice cloning dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          printf 'numpy==1.26.4\npyarrow==25.0.1\ndatasets==5.0.1\ntorch==2.5.1+cpu\ntorchaudio==2.5.1+cpu\n' > /tmp/starwhim-constraints.txt
          python -m pip install -c /tmp/starwhim-constraints.txt 'f5-tts==1.1.5' 'transformers<5'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/torch/hub
          key: starwhim-f5tts-model-v1-20261118
      - name: Generate one new game introduction in same girl voice
        env:
          SHARD: ${{ matrix.shard }}
        run: python scripts/clone_on_github.py --manifest voice-v19-plan.json --shard "$SHARD" --shards 5
      - uses: actions/upload-artifact@v4
        with:
          name: v19-girl-clip-${{ matrix.shard }}
          path: generated/*.mp3
          retention-days: 7
          if-no-files-found: error
  package:
    needs: synthesize
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: v19-girl-clip-*
          path: generated
          merge-multiple: true
      - name: Install latest games and genuine MP3s
        run: |
          python scripts/install_expansion_v19.py
          python scripts/pack_additional_voice.py --manifest voice-v19-plan.json
          python - <<'PY'
          import json,re
          from pathlib import Path
          s=Path('index.html').read_text()
          pack=json.loads(re.search(r'window\.StarwhimVoicePack\s*=\s*({.*?});\s*</script>',s,re.S).group(1))
          rows=json.loads(Path('voice-v19-plan.json').read_text())['lines']
          assert all(x['text'] in pack['audio'] for x in rows)
          assert len(pack['audio'])>=205,len(pack['audio'])
          assert 'const v19Intro=' in s
          print('PASS 205 actual MP3 voice clips, 19 games, 200 Chinese characters, 80 English words')
          PY
      - name: Commit new voiced game
        run: |
          git config user.name "starwhim-game-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add five same-reference girl voice recordings for v1.9 games"
          git pull --rebase origin main
          git push origin HEAD:main
